<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Brain memory graph</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --ink: #e8e8e8;
      --muted: #9a9a9a;
      --line: #3a3a3a;
      --node: #8a8a8a;
      --link: #3f3f3f;
      --hot: #d7d7d7;
      --accent: #7aa2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      gap: 12px;
      align-items: end;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
    }
    h1 { font-size: 16px; font-weight: 500; margin: 0 16px 0 0; }
    form { display: flex; gap: 8px; align-items: end; flex: 1; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1; }
    input, button {
      font: inherit;
      color: var(--ink);
      background: #1c1c1c;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
    }
    button { cursor: pointer; }
    #status { min-width: 220px; color: var(--muted); font-size: 12px; padding-bottom: 6px; }
    #stage { flex: 1; display: flex; min-height: 0; }
    canvas { flex: 1; width: 100%; display: block; touch-action: none; }
    aside {
      width: 320px;
      border-left: 1px solid var(--line);
      padding: 16px;
      overflow: auto;
    }
    aside h2 { font-size: 15px; font-weight: 500; margin: 0 0 8px; }
    #detail-meta, #detail-body { margin: 0; color: var(--muted); white-space: pre-wrap; }
    #detail-body { color: var(--ink); margin-top: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Memory graph</h1>
    <form id="search">
      <label>Search
        <input id="query" name="query" type="text" autocomplete="off" placeholder="Ask for a memory">
      </label>
      <button type="submit">Retrieve</button>
    </form>
    <p id="status" role="status">Waiting for a server call.</p>
  </header>
  <div id="stage">
    <canvas id="view" aria-label="Memories linked by embedding similarity. Drag a node, scroll to zoom, or click a memory to read it."></canvas>
    <aside id="detail" aria-live="polite">
      <h2 id="detail-title">Select a memory</h2>
      <p id="detail-meta">Click a node, or search. Drag the background to pan and scroll to zoom.</p>
      <p id="detail-body"></p>
    </aside>
  </div>
  <script>
    const canvas = document.getElementById("view");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");
    const nodes = [];
    const links = [];
    const byId = new Map();
    let lastEventId = 0;
    let hotUntil = 0;
    let queryLabel = "";
    let selectedId = null;
    let hoverId = null;
    let drag = null;
    const camera = { x: 0, y: 0, k: 1 };
    const neighborIds = new Set();

    function resize() {
      canvas.width = canvas.clientWidth * devicePixelRatio;
      canvas.height = canvas.clientHeight * devicePixelRatio;
    }
    window.addEventListener("resize", resize);
    resize();

    function kick(node, scale) {
      const angle = Math.random() * Math.PI * 2;
      node.vx += Math.cos(angle) * scale;
      node.vy += Math.sin(angle) * scale;
      node.hot = performance.now() + 6000;
    }

    function addNode(id, title) {
      const existing = byId.get(id);
      if (existing) {
        existing.title = title || existing.title;
        return existing;
      }
      const node = {
        id,
        title: title || String(id),
        x: canvas.clientWidth / 2 + (Math.random() - 0.5) * 30,
        y: canvas.clientHeight / 2 + (Math.random() - 0.5) * 30,
        vx: 0,
        vy: 0,
        hot: 0,
        tone: "",
      };
      nodes.push(node);
      byId.set(id, node);
      return node;
    }

    function removeNode(id) {
      const node = byId.get(id);
      if (!node) return;
      byId.delete(id);
      const index = nodes.indexOf(node);
      if (index >= 0) nodes.splice(index, 1);
      for (let i = links.length - 1; i >= 0; i--) {
        if (links[i].source.id === id || links[i].target.id === id) links.splice(i, 1);
      }
      neighborIds.delete(id);
      if (selectedId === id) {
        selectedId = null;
        neighborIds.clear();
        document.getElementById("detail-title").textContent = "Select a memory";
        document.getElementById("detail-meta").textContent = "That memory was deleted.";
        document.getElementById("detail-body").textContent = "";
      }
    }

    function replaceLinks(id, nextLinks) {
      for (let i = links.length - 1; i >= 0; i--) {
        if (links[i].source.id === id || links[i].target.id === id) links.splice(i, 1);
      }
      const until = performance.now() + 6000;
      for (const link of nextLinks) {
        const source = byId.get(link.source);
        const target = byId.get(link.target);
        if (!source || !target) continue;
        links.push({ source, target, weight: link.weight, hot: until });
      }
    }

    async function syncMemory(id, tone) {
      const response = await fetch(`/neighbors/${id}`);
      if (!response.ok) return null;
      const detail = await response.json();
      const node = addNode(detail.id, detail.title);
      node.tone = tone;
      replaceLinks(id, detail.links || []);
      kick(node, tone === "save_memory" ? 8 : 4.5);
      return node;
    }

    async function applyEvent(event) {
      const action = event.action || event.retrieval;
      const ids = event.memory_ids || [];
      hotUntil = performance.now() + 6000;
      if (action === "delete_memory") {
        for (const id of ids) removeNode(id);
        queryLabel = "delete_memory";
        statusEl.textContent = `delete_memory removed ${ids.length}. ${nodes.length} memories, ${links.length} links.`;
        return;
      }
      if (action === "save_memory" || action === "update_memory" || action === "backfill_embeddings" || action === "reembed_embeddings") {
        let touched = 0;
        for (const id of ids.slice(0, 40)) {
          if (await syncMemory(id, action)) touched += 1;
        }
        queryLabel = action;
        statusEl.textContent = `${action} touched ${touched}. ${nodes.length} memories, ${links.length} links.`;
        if (ids[0]) selectMemory(ids[0]);
        return;
      }
      const idSet = new Set(ids);
      queryLabel = event.query ? event.query : "recent memories";
      for (const node of nodes) {
        if (!idSet.has(node.id)) continue;
        node.tone = "retrieve_memories";
        kick(node, 4.5);
        node.x += (canvas.clientWidth / 2 - node.x) * 0.08;
        node.y += (canvas.clientHeight / 2 - node.y) * 0.08;
      }
      for (const link of links) {
        if (idSet.has(link.source.id) || idSet.has(link.target.id)) {
          link.hot = performance.now() + 6000;
        }
      }
      const count = idSet.size;
      statusEl.textContent = count
        ? `retrieve_memories (${event.retrieval}): ${count} memories for “${queryLabel}”`
        : `retrieve_memories (${event.retrieval}): no memories for “${queryLabel}”`;
      const first = ids[0];
      if (first) selectMemory(first);
    }

    function screenToWorld(sx, sy) {
      return { x: (sx - camera.x) / camera.k, y: (sy - camera.y) / camera.k };
    }

    function hitNode(wx, wy) {
      const reach = 10 / camera.k;
      let best = null;
      let bestDistance = reach;
      for (const node of nodes) {
        const distance = Math.hypot(node.x - wx, node.y - wy);
        if (distance <= bestDistance) {
          best = node;
          bestDistance = distance;
        }
      }
      return best;
    }

    async function selectMemory(id) {
      selectedId = id;
      neighborIds.clear();
      for (const link of links) {
        if (link.source.id === id) neighborIds.add(link.target.id);
        if (link.target.id === id) neighborIds.add(link.source.id);
      }
      const response = await fetch(`/memories/${id}`);
      if (!response.ok) return;
      const memory = await response.json();
      document.getElementById("detail-title").textContent = memory.title || `Memory ${memory.id}`;
      const tags = (memory.tags || []).join(", ");
      document.getElementById("detail-meta").textContent = [
        memory.source,
        memory.created_at,
        tags,
        neighborIds.size ? `${neighborIds.size} linked memories` : "",
      ].filter(Boolean).join(" · ");
      document.getElementById("detail-body").textContent = memory.content || "";
    }

    async function poll() {
      const response = await fetch(`/events?after=${lastEventId}`);
      const payload = await response.json();
      for (const event of payload.events) {
        lastEventId = event.id;
        await applyEvent(event);
      }
    }

    function tick() {
      const width = canvas.width / devicePixelRatio;
      const height = canvas.height / devicePixelRatio;
      const cx = width / 2;
      const cy = height / 2;
      const neighbors = 20;
      for (let i = 0; i < nodes.length; i++) {
        for (let k = 1; k <= neighbors; k++) {
          const a = nodes[i];
          const b = nodes[(i + k) % nodes.length];
          let dx = a.x - b.x;
          let dy = a.y - b.y;
          let dist = Math.hypot(dx, dy) || 0.01;
          const force = 120 / (dist * dist);
          dx /= dist;
          dy /= dist;
          a.vx += dx * force;
          a.vy += dy * force;
          b.vx -= dx * force;
          b.vy -= dy * force;
        }
      }
      for (const link of links) {
        const a = link.source;
        const b = link.target;
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        const dist = Math.hypot(dx, dy) || 0.01;
        const delta = (dist - 70) * 0.004 * link.weight;
        dx /= dist;
        dy /= dist;
        a.vx += dx * delta;
        a.vy += dy * delta;
        b.vx -= dx * delta;
        b.vy -= dy * delta;
      }
      const now = performance.now();
      for (const node of nodes) {
        if (node.pinned) {
          node.vx = 0;
          node.vy = 0;
          continue;
        }
        node.vx += (cx - node.x) * 0.0008;
        node.vy += (cy - node.y) * 0.0008;
        node.vx *= 0.86;
        node.vy *= 0.86;
        node.x += node.vx;
        node.y += node.vy;
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.setTransform(
        devicePixelRatio * camera.k,
        0,
        0,
        devicePixelRatio * camera.k,
        devicePixelRatio * camera.x,
        devicePixelRatio * camera.y,
      );
      for (const link of links) {
        const hot = link.hot && link.hot > now;
        const selected = link.source.id === selectedId || link.target.id === selectedId;
        ctx.strokeStyle = hot || selected ? "#7aa2ff" : "#3a3a3a";
        ctx.globalAlpha = hot || selected ? 0.9 : 0.35;
        ctx.lineWidth = (hot || selected ? 1.6 : 0.6) / camera.k;
        ctx.beginPath();
        ctx.moveTo(link.source.x, link.source.y);
        ctx.lineTo(link.target.x, link.target.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      for (const node of nodes) {
        const hot = node.hot && node.hot > now;
        const selected = node.id === selectedId;
        const neighbor = neighborIds.has(node.id);
        const hovered = node.id === hoverId;
        const toneColor = {
          save_memory: "#7dcea0",
          update_memory: "#f0c674",
          retrieve_memories: "#7aa2ff",
          backfill_embeddings: "#7dcea0",
          reembed_embeddings: "#f0c674",
        };
        ctx.fillStyle = selected || hot
          ? (toneColor[node.tone] || "#7aa2ff")
          : neighbor ? "#c5d4ff" : "#8d8d8d";
        ctx.beginPath();
        ctx.arc(node.x, node.y, (selected || hot ? 7 : hovered ? 5 : 2.5) / camera.k, 0, Math.PI * 2);
        ctx.fill();
        if (selected || hot || hovered) {
          ctx.fillStyle = "#e8e8e8";
          ctx.font = `${11 / camera.k}px ui-sans-serif, system-ui, sans-serif`;
          ctx.fillText(node.title || String(node.id), node.x + 8 / camera.k, node.y - 8 / camera.k);
        }
      }
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      if (hotUntil > now && queryLabel) {
        ctx.fillStyle = "#9a9a9a";
        ctx.font = "12px ui-sans-serif, system-ui, sans-serif";
        ctx.fillText(queryLabel, 16, height - 16);
      }
      requestAnimationFrame(tick);
    }

    function pointerPosition(event) {
      const rect = canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    canvas.addEventListener("pointerdown", (event) => {
      const screen = pointerPosition(event);
      const world = screenToWorld(screen.x, screen.y);
      const node = hitNode(world.x, world.y);
      canvas.setPointerCapture(event.pointerId);
      if (node) {
        node.pinned = true;
        drag = { type: "node", node, dx: world.x - node.x, dy: world.y - node.y };
        selectMemory(node.id);
      } else {
        drag = { type: "pan", x: screen.x, y: screen.y, cx: camera.x, cy: camera.y };
      }
    });

    canvas.addEventListener("pointermove", (event) => {
      const screen = pointerPosition(event);
      const world = screenToWorld(screen.x, screen.y);
      if (!drag) {
        const node = hitNode(world.x, world.y);
        hoverId = node ? node.id : null;
        canvas.style.cursor = node ? "pointer" : "grab";
        return;
      }
      if (drag.type === "node") {
        drag.node.x = world.x - drag.dx;
        drag.node.y = world.y - drag.dy;
        canvas.style.cursor = "grabbing";
        return;
      }
      camera.x = drag.cx + (screen.x - drag.x);
      camera.y = drag.cy + (screen.y - drag.y);
      canvas.style.cursor = "grabbing";
    });

    function endDrag() {
      if (drag && drag.type === "node") drag.node.pinned = false;
      drag = null;
      canvas.style.cursor = "grab";
    }
    canvas.addEventListener("pointerup", endDrag);
    canvas.addEventListener("pointercancel", endDrag);

    canvas.addEventListener("wheel", (event) => {
      event.preventDefault();
      const screen = pointerPosition(event);
      const before = screenToWorld(screen.x, screen.y);
      const factor = event.deltaY < 0 ? 1.08 : 0.92;
      camera.k = Math.min(4, Math.max(0.35, camera.k * factor));
      camera.x = screen.x - before.x * camera.k;
      camera.y = screen.y - before.y * camera.k;
    }, { passive: false });

    async function start() {
      resize();
      const graph = await (await fetch("/graph")).json();
      const count = graph.nodes.length;
      const radius = Math.min(canvas.clientWidth, canvas.clientHeight) * 0.38;
      graph.nodes.forEach((node, index) => {
        const angle = (index / Math.max(count, 1)) * Math.PI * 2;
        const placed = {
          ...node,
          x: canvas.clientWidth / 2 + Math.cos(angle) * radius,
          y: canvas.clientHeight / 2 + Math.sin(angle) * radius * 0.72,
          vx: 0,
          vy: 0,
          hot: 0,
        };
        nodes.push(placed);
        byId.set(node.id, placed);
      });
      for (const link of graph.links) {
        const source = byId.get(link.source);
        const target = byId.get(link.target);
        if (source && target) links.push({ source, target, weight: link.weight, hot: 0 });
      }
      statusEl.textContent = `${nodes.length} memories, ${links.length} similarity links.`;
      const existing = await (await fetch("/events?after=0")).json();
      if (existing.events.length) {
        lastEventId = existing.events[existing.events.length - 1].id - 1;
        applyEvent(existing.events[existing.events.length - 1]);
      }
      setInterval(() => { poll().catch(() => {}); }, 1000);
      requestAnimationFrame(tick);
    }

    document.getElementById("search").addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = document.getElementById("query").value;
      statusEl.textContent = "Retrieving…";
      await fetch("/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query }),
      });
      await poll();
    });

    start();
  </script>
</body>
</html>
